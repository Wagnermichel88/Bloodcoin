# Prüft jeden Tag die Meldungen des Orakels gegen die CDC-Zahlen, unabhängig vom Server.
# Schlägt der Lauf fehl, stimmt eine Meldung nicht, der Melder ist abgeschaltet oder er schweigt.
# Siehe oracle/watch/README.md.
name: Oracle watch

on:
  schedule:
    - cron: "0 7 * * *"   # täglich 07:00 UTC; die Meldung kommt montags 12:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "oracle/watch/**"
      - "oracle/signed/report.py"
      - ".github/workflows/oracle-watch.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Zurzeit das Testnetz (Base Sepolia). Nach dem Mainnet-Deploy diese drei Werte ersetzen:
      # RPC https://mainnet.base.org, Orakel-Adresse und Deploy-Block aus dem Deploy.
      RPC: https://sepolia.base.org
      ORACLE: "0x6883Cba0F7daD8a4A998b346bF35d971aF0a8E19"
      FROM_BLOCK: "48284210"
      NTFY_URL: ${{ secrets.NTFY_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Meldungen prüfen
        run: python3 oracle/watch/check.py --rpc "$RPC" --oracle "$ORACLE" --from-block "$FROM_BLOCK"
